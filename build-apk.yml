name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: |
          cd android-app
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Init Capacitor
        run: |
          cd android-app
          npx cap init "Mindbot Genius" "com.binaryglobalnetwork.mindbotgenius" --web-dir www

      - name: Add Android
        run: |
          cd android-app
          npx cap add android

      - name: Sync
        run: |
          cd android-app
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android-app/android/gradlew

      - name: Build APK
        run: |
          cd android-app/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mindbot-Genius-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Mindbot Genius APK Build ${{ github.run_number }}
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
