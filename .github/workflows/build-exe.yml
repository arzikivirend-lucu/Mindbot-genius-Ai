name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindbot-Genius-EXE
          path: dist/*.exe

      - name: Publish to latest-exe release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-exe
          name: Mindbot Genius EXE (latest)
          body: |
            Auto-built from commit ${{ github.sha }} (run #${{ github.run_number }}).
            This release is always overwritten with the newest Windows build.
          files: dist/Mindbot-Genius-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
