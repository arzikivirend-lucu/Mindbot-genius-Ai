<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mindbot Genius — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg:#0a0c14; --surface:#0f1220; --surface2:#171b2e; --border:#1e2540; --gold:#c8a84b; --text:#e8eaf0; --text-dim:#5a6380; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 60% 50% at 30% 20%, rgba(37,99,235,0.08) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 70% 80%, rgba(200,168,75,0.06) 0%,transparent 60%); pointer-events:none; }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:40px 36px; width:100%; max-width:400px; position:relative; z-index:1; }

    .logo-wrap { display:flex; flex-direction:column; align-items:center; margin-bottom:32px; }
    .logo-img { width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid var(--gold); box-shadow:0 0 30px rgba(200,168,75,0.25); margin-bottom:14px; }
    .logo-name { font-size:22px; font-weight:800; } .logo-name span { color:var(--gold); }
    .logo-sub { font-size:10px; font-family:'DM Mono',monospace; color:var(--text-dim); letter-spacing:1.5px; text-transform:uppercase; margin-top:4px; }

    .tabs { display:flex; gap:0; margin-bottom:28px; background:var(--surface2); border-radius:10px; padding:4px; }
    .tab { flex:1; padding:9px; text-align:center; font-size:13px; font-weight:700; cursor:pointer; border-radius:7px; transition:all 0.2s; color:var(--text-dim); }
    .tab.active { background:var(--bg); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,0.3); }

    .form-group { margin-bottom:16px; }
    label { display:block; font-size:11px; font-family:'DM Mono',monospace; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
    input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text); font-family:'Syne',sans-serif; font-size:14px; outline:none; transition:border-color 0.2s,box-shadow 0.2s; }
    input::placeholder { color:var(--text-dim); }
    input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(200,168,75,0.1); }

    .btn-submit { width:100%; padding:13px; background:linear-gradient(135deg,#1a4fc4,var(--gold)); border:none; border-radius:12px; color:#fff; font-family:'Syne',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:opacity 0.2s,transform 0.15s; margin-top:8px; }
    .btn-submit:hover { opacity:0.9; transform:translateY(-1px); }
    .btn-submit:active { transform:translateY(0); }
    .btn-submit:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

    .error-msg { background:rgba(220,38,38,0.1); border:1px solid rgba(220,38,38,0.3); color:#f87171; padding:10px 14px; border-radius:9px; font-size:13px; font-family:'DM Mono',monospace; margin-bottom:16px; display:none; }
    .error-msg.show { display:block; }
    .success-msg { background:rgba(74,222,128,0.1); border:1px solid rgba(74,222,128,0.3); color:#4ade80; padding:10px 14px; border-radius:9px; font-size:13px; font-family:'DM Mono',monospace; margin-bottom:16px; display:none; }
    .success-msg.show { display:block; }

    .divider { text-align:center; font-size:11px; font-family:'DM Mono',monospace; color:var(--text-dim); margin:20px 0 0; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img class="logo-img" src="logo.png" alt="Mindbot"/>
    <div class="logo-name">Mindbot <span>Genius</span></div>
    <div class="logo-sub">Binary Global Network</div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Masuk</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">Daftar</div>
  </div>

  <div id="error-msg" class="error-msg"></div>
  <div id="success-msg" class="success-msg"></div>

  <!-- LOGIN FORM -->
  <div id="form-login">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="login-username" placeholder="Masukkan username" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Masukkan password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="btn-submit" id="btn-login" onclick="doLogin()">Masuk →</button>
    <div class="divider">Belum punya akun? <a href="#" onclick="switchTab('register')" style="color:var(--gold)">Daftar sekarang</a></div>
  </div>

  <!-- REGISTER FORM -->
  <div id="form-register" style="display:none">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="reg-username" placeholder="Min. 3 karakter" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="Min. 6 karakter" autocomplete="new-password"/>
    </div>
    <div class="form-group">
      <label>Konfirmasi Password</label>
      <input type="password" id="reg-confirm" placeholder="Ulangi password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()"/>
    </div>
    <button class="btn-submit" id="btn-register" onclick="doRegister()">Daftar →</button>
    <div class="divider">Sudah punya akun? <a href="#" onclick="switchTab('login')" style="color:var(--gold)">Masuk</a></div>
  </div>
</div>

<script>
  // If already logged in, redirect
  if (localStorage.getItem('mbg_token')) window.location.href = '/';

  function switchTab(tab) {
    document.getElementById('form-login').style.display = tab==='login' ? 'block' : 'none';
    document.getElementById('form-register').style.display = tab==='register' ? 'block' : 'none';
    document.getElementById('tab-login').className = 'tab' + (tab==='login'?' active':'');
    document.getElementById('tab-register').className = 'tab' + (tab==='register'?' active':'');
    hideMessages();
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg; el.classList.add('show');
    document.getElementById('success-msg').classList.remove('show');
  }
  function showSuccess(msg) {
    const el = document.getElementById('success-msg');
    el.textContent = msg; el.classList.add('show');
    document.getElementById('error-msg').classList.remove('show');
  }
  function hideMessages() {
    document.getElementById('error-msg').classList.remove('show');
    document.getElementById('success-msg').classList.remove('show');
  }

  async function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) return showError('Isi semua kolom');
    const btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password}) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      localStorage.setItem('mbg_token', data.token);
      localStorage.setItem('mbg_username', data.username);
      showSuccess('Berhasil masuk! Mengalihkan...');
      setTimeout(() => window.location.href = '/', 800);
    } catch(e) {
      showError(e.message);
      btn.disabled=false; btn.textContent='Masuk →';
    }
  }

  async function doRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm  = document.getElementById('reg-confirm').value;
    if (!username||!password||!confirm) return showError('Isi semua kolom');
    if (password !== confirm) return showError('Password tidak cocok');
    const btn = document.getElementById('btn-register');
    btn.disabled=true; btn.textContent='Memproses...';
    try {
      const res = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username,password}) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      localStorage.setItem('mbg_token', data.token);
      localStorage.setItem('mbg_username', data.username);
      showSuccess('Akun berhasil dibuat! Mengalihkan...');
      setTimeout(() => window.location.href = '/', 800);
    } catch(e) {
      showError(e.message);
      btn.disabled=false; btn.textContent='Daftar →';
    }
  }
</script>
</body>
</html>
