<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NexusAI — Binary Global Network</title>
  <link rel="icon" type="image/png" href="assets/logo-icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #111118;
      --sidebar:  #0d0d13;
      --border:   #1e1e2e;
      --accent:   #7c6af7;
      --accent2:  #a78bfa;
      --glow:     rgba(124,106,247,0.18);
      --text:     #e8e8f0;
      --muted:    #6b6b85;
      --user-bg:  #1a1a2e;
      --ai-bg:    #13131f;
      --error:    #ff5e6c;
      --font:     'Space Grotesk', sans-serif;
      --mono:     'JetBrains Mono', monospace;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      display: flex;
      overflow: hidden;
    }

    .app { display: flex; width: 100%; height: 100%; }

    .main-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.25s ease;
    }

    .sidebar.collapsed { margin-left: -260px; }

    .sidebar-header { padding: 16px 14px 10px; flex-shrink: 0; }

    .new-chat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glow);
      border: 1px solid #7c6af740;
      color: var(--accent2);
      font-family: var(--font);
      font-size: 13.5px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .new-chat-btn:hover { background: #7c6af730; border-color: var(--accent); }
    .new-chat-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    .sidebar-search { margin: 8px 14px 4px; position: relative; }
    .sidebar-search input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 12.5px;
      padding: 8px 10px 8px 30px;
      border-radius: 8px;
      outline: none;
    }
    .sidebar-search input:focus { border-color: var(--accent); }
    .sidebar-search svg {
      position: absolute; left: 9px; top: 50%;
      transform: translateY(-50%);
      width: 13px; height: 13px;
      color: var(--muted);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .session-list::-webkit-scrollbar { width: 4px; }
    .session-list::-webkit-scrollbar-track { background: transparent; }
    .session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .session-group-label {
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 14px 8px 6px;
      font-weight: 600;
    }
    .session-group-label:first-child { padding-top: 4px; }

    .session-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      transition: background 0.15s, color 0.15s;
    }
    .session-item:hover { background: var(--surface); color: var(--text); }
    .session-item.active { background: var(--glow); color: var(--accent2); }

    .session-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .session-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .session-item:hover .session-delete { opacity: 1; }
    .session-delete:hover { background: var(--error); color: #fff; }
    .session-delete svg { width: 13px; height: 13px; }

    .session-empty {
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
      padding: 24px 10px;
      line-height: 1.6;
    }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    .sidebar-toggle {
      width: 32px;
      height: 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .sidebar-toggle:hover { border-color: var(--accent); color: var(--accent2); }
    .sidebar-toggle svg { width: 16px; height: 16px; }

    /* ─── HEADER ─── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      gap: 14px;
    }

    .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .logo { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .logo-icon {
      width: 38px; height: 38px;
      background: #0a1420;
      border-radius: 10px;
      display: grid; place-items: center;
      box-shadow: 0 0 20px var(--glow);
      flex-shrink: 0;
      overflow: hidden;
      padding: 3px;
    }
    .logo-icon img { width: 100%; height: 100%; object-fit: contain; }

    .logo-name {
      font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
      background: linear-gradient(120deg, var(--accent2), #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .logo-sub {
      font-size: 10px; color: var(--muted); font-weight: 400;
      letter-spacing: 0.08em; text-transform: uppercase; margin-top: 1px;
    }

    .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .model-select {
      background: var(--border);
      border: 1px solid #2a2a3e;
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .model-select:hover { border-color: var(--accent); }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-clear:hover { border-color: var(--error); color: var(--error); }

    /* ─── CHAT AREA ─── */
    .chat-wrap { flex: 1; overflow-y: auto; padding: 24px 0; scroll-behavior: smooth; }
    .chat-wrap::-webkit-scrollbar { width: 4px; }
    .chat-wrap::-webkit-scrollbar-track { background: transparent; }
    .chat-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .messages {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; text-align: center; gap: 16px;
    }

    .empty-glyph {
      width: 80px; height: 80px;
      background: #0a1420;
      border: 1px solid #7c6af730;
      border-radius: 22px;
      display: grid; place-items: center;
      margin-bottom: 4px;
      padding: 10px;
      box-shadow: 0 0 30px var(--glow);
    }
    .empty-glyph img { width: 100%; height: 100%; object-fit: contain; }
    .empty-state h2 { font-size: 22px; font-weight: 600; color: var(--text); }
    .empty-state p { font-size: 14px; color: var(--muted); max-width: 360px; line-height: 1.6; }

    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent2); background: var(--glow); }

    .msg { display: flex; gap: 12px; animation: fadeUp 0.25s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 13px; font-weight: 600;
      overflow: hidden;
    }
    .msg.user .avatar { background: linear-gradient(135deg, #7c6af7, #4f46e5); color: #fff; }
    .msg.ai .avatar {
      background: #0a1420;
      border: 1px solid var(--border);
      color: var(--accent2);
      padding: 4px;
    }
    .msg.ai .avatar img { width: 100%; height: 100%; object-fit: contain; }

    .bubble { max-width: 88%; padding: 14px 18px; border-radius: 16px; line-height: 1.7; font-size: 14.5px; }
    .msg.user .bubble { background: var(--user-bg); border: 1px solid #2a2a4e; border-top-right-radius: 4px; color: #d0d0f0; }
    .msg.ai .bubble { background: var(--ai-bg); border: 1px solid var(--border); border-top-left-radius: 4px; color: var(--text); }

    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { color: var(--accent2); font-weight: 600; }
    .bubble em { color: #b0b0d0; }
    .bubble ul, .bubble ol { padding-left: 20px; margin-bottom: 8px; }
    .bubble li { margin-bottom: 4px; }
    .bubble h1,.bubble h2,.bubble h3 { color: var(--accent2); margin: 14px 0 8px; font-weight: 600; }
    .bubble h1 { font-size: 1.2em; }
    .bubble h2 { font-size: 1.1em; }
    .bubble h3 { font-size: 1em; }
    .bubble a { color: var(--accent2); }

    .bubble pre {
      background: #0d0d14; border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; overflow-x: auto; margin: 10px 0; position: relative;
    }
    .bubble code:not(pre code) {
      background: #1a1a2e; border: 1px solid var(--border); color: #c4b5fd;
      font-family: var(--mono); font-size: 12.5px; padding: 2px 6px; border-radius: 5px;
    }
    .bubble pre code { font-family: var(--mono); font-size: 12.5px; background: none; border: none; padding: 0; }

    .bubble-images { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .bubble-images img {
      max-width: 180px; max-height: 180px; border-radius: 10px;
      border: 1px solid var(--border); object-fit: cover; cursor: zoom-in;
    }

    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      background: var(--border); border: none; color: var(--muted);
      font-family: var(--font); font-size: 11px; padding: 4px 8px;
      border-radius: 6px; cursor: pointer; transition: all 0.2s;
    }
    .copy-btn:hover { background: var(--accent); color: #fff; }

    .typing-dots { display: flex; align-items: center; gap: 4px; padding: 6px 4px; }
    .typing-dots span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: dot 1.2s infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 0%,80%,100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.1); } }

    .input-wrap { padding: 16px 20px 20px; background: var(--bg); border-top: 1px solid var(--border); flex-shrink: 0; }

    .input-box {
      max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 10px; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }

    #composer { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

    #attachBtn {
      width: 38px; height: 38px; background: var(--border); border: 1px solid #2a2a3e;
      border-radius: 10px; cursor: pointer; display: grid; place-items: center;
      flex-shrink: 0; color: var(--muted); transition: all 0.2s;
    }
    #attachBtn:hover { color: var(--accent2); border-color: var(--accent); }
    #attachBtn svg { width: 17px; height: 17px; }

    #micBtn {
      width: 38px; height: 38px; background: var(--border); border: 1px solid #2a2a3e;
      border-radius: 10px; cursor: pointer; display: grid; place-items: center;
      flex-shrink: 0; color: var(--muted); transition: all 0.2s; position: relative;
    }
    #micBtn:hover { color: var(--accent2); border-color: var(--accent); }
    #micBtn svg { width: 17px; height: 17px; }
    #micBtn.listening {
      background: var(--error);
      border-color: var(--error);
      color: #fff;
      animation: micPulse 1.4s infinite;
    }
    @keyframes micPulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,94,108,0.5); }
      70%  { box-shadow: 0 0 0 10px rgba(255,94,108,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,94,108,0); }
    }

    .tts-toggle {
      display: flex; align-items: center; gap: 6px;
      background: var(--border); border: 1px solid #2a2a3e;
      color: var(--muted); font-family: var(--font); font-size: 11.5px;
      padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
      white-space: nowrap;
    }
    .tts-toggle:hover { border-color: var(--accent); }
    .tts-toggle.active { background: var(--glow); border-color: var(--accent); color: var(--accent2); }
    .tts-toggle svg { width: 13px; height: 13px; flex-shrink: 0; }

    .speak-btn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; padding: 3px; border-radius: 6px;
      display: inline-grid; place-items: center; vertical-align: middle;
      transition: all 0.15s; margin-left: 6px;
    }
    .speak-btn:hover { color: var(--accent2); background: var(--glow); }
    .speak-btn.speaking { color: var(--accent); animation: speakBlink 1s infinite; }
    .speak-btn svg { width: 14px; height: 14px; }
    @keyframes speakBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .msg-actions { margin-top: 6px; display: flex; align-items: center; gap: 4px; }

    #previewStrip { display: flex; flex-wrap: wrap; gap: 8px; }
    #previewStrip:empty { display: none; }

    .preview-thumb {
      position: relative; width: 56px; height: 56px; border-radius: 10px;
      overflow: hidden; border: 1px solid var(--border); flex-shrink: 0;
    }
    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-thumb .remove-thumb {
      position: absolute; top: 2px; right: 2px; width: 16px; height: 16px;
      background: rgba(0,0,0,0.7); border: none; border-radius: 50%; color: #fff;
      font-size: 10px; line-height: 1; cursor: pointer; display: grid; place-items: center;
    }
    .preview-thumb .remove-thumb:hover { background: var(--error); }

    #userInput {
      flex: 1; background: none; border: none; outline: none; color: var(--text);
      font-family: var(--font); font-size: 14.5px; line-height: 1.6; resize: none;
      max-height: 140px; min-height: 24px;
    }
    #userInput::placeholder { color: var(--muted); }

    #sendBtn {
      width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none; border-radius: 10px; cursor: pointer; display: grid; place-items: center;
      flex-shrink: 0; transition: opacity 0.2s, transform 0.15s; box-shadow: 0 0 16px var(--glow);
    }
    #sendBtn:hover { opacity: 0.9; transform: scale(1.05); }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    #sendBtn svg { width: 16px; height: 16px; }

    .footer-note { text-align: center; font-size: 11px; color: var(--muted); margin-top: 10px; }

    @media (max-width: 860px) {
      .sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 100; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
      .sidebar.collapsed { margin-left: -260px; }
      .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
      .sidebar-overlay.show { display: block; }
    }

    @media (max-width: 600px) {
      .logo-sub { display: none; }
      .model-select { font-size: 11px; padding: 5px 8px; }
      .btn-clear { display: none; }
    }
  </style>
</head>
<body>

<div class="app">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Percakapan Baru
      </button>
    </div>
    <div class="sidebar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchSessions" placeholder="Cari percakapan..."/>
    </div>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-footer">
      NexusAI — <a href="baba.html" style="cursor: pointer; color: var(--accent2); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--accent2)'">Binary Global Network</a>
    </div>
  </aside>

  <div class="main-col">
    <header>
      <div class="header-left">
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
        <div class="logo">
          <div class="logo-icon">
            <img src="assets/logo-icon.png" alt="NexusAI"/>
          </div>
          <div>
            <div class="logo-name">NexusAI</div>
            <div class="logo-sub" style="cursor: pointer;" onclick="window.location.href='baba.html'" title="Klik untuk membuka Binary Global Network">Binary Global Network</div>
          </div>
        </div>
      </div>
      <div class="header-right">
        <select class="model-select" id="modelSelect">
          <option value="llama-3.3-70b-versatile">Llama 3.3 70B ⭐</option>
          <option value="llama-3.1-8b-instant">Llama 3.1 8B (Cepat)</option>
          <option value="qwen/qwen3-32b">Qwen3 32B</option>
          <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
        </select>
        <button class="tts-toggle" id="ttsToggle" title="Aktifkan suara AI">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
          </svg>
          <span>Suara</span>
        </button>
        <button class="btn-clear" id="clearBtn">Hapus Chat</button>
      </div>
    </header>

    <div class="chat-wrap" id="chatWrap">
      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <div class="empty-glyph">
            <img src="assets/logo-icon.png" alt="NexusAI"/>
          </div>
          <h2>Selamat datang di NexusAI</h2>
          <p>Asisten AI cerdas siap membantu kamu coding, menulis, belajar, dan berkreasi.</p>
          <div class="suggestions">
            <button class="chip" onclick="sendChip(this)">Buatkan kode login form HTML</button>
            <button class="chip" onclick="sendChip(this)">Jelaskan cara kerja async/await</button>
            <button class="chip" onclick="sendChip(this)">Tulis pantun tentang teknologi</button>
            <button class="chip" onclick="sendChip(this)">Rangkum konsep REST API</button>
          </div>
        </div>
      </div>
    </div>

    <div class="input-wrap">
      <div class="input-box">
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple style="display:none"/>
        <button id="attachBtn" title="Lampirkan gambar" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <button id="micBtn" title="Bicara dengan AI" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <div id="composer">
          <div id="previewStrip"></div>
          <textarea id="userInput" placeholder="Tanya apa saja, atau lampirkan gambar..." rows="1"></textarea>
        </div>
        <button id="sendBtn" title="Kirim">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <p class="footer-note">NexusAI bisa salah. Verifikasi informasi penting. Gambar dianalisis otomatis dengan model vision.</p>
    </div>
  </div>

</div>

<script>
  const chatWrap   = document.getElementById('chatWrap');
  const messages    = document.getElementById('messages');
  const input       = document.getElementById('userInput');
  const sendBtn     = document.getElementById('sendBtn');
  const emptyState  = document.getElementById('emptyState');
  const modelSel    = document.getElementById('modelSelect');
  const fileInput   = document.getElementById('fileInput');
  const attachBtn   = document.getElementById('attachBtn');
  const micBtn      = document.getElementById('micBtn');
  const ttsToggle   = document.getElementById('ttsToggle');
  const previewStrip = document.getElementById('previewStrip');
  const sidebar     = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const newChatBtn  = document.getElementById('newChatBtn');
  const sessionList = document.getElementById('sessionList');
  const searchInput = document.getElementById('searchSessions');

  let history = [];
  let isStreaming = false;
  let pendingImages = [];
  let currentSessionId = null;
  let sessions = {};

  const VISION_MODEL = 'meta-llama/llama-4-scout-17b-16e-instruct';
  const MAX_IMAGES = 5;
  const STORAGE_KEY = 'nexusai_sessions';
  const TTS_KEY = 'nexusai_tts_enabled';

  let ttsEnabled = localStorage.getItem(TTS_KEY) === 'true';
  let isListening = false;
  let recognition = null;
  let currentUtterance = null;
  let indonesianVoice = null;

  marked.setOptions({ breaks: true, gfm: true });

  function loadSessions() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      sessions = raw ? JSON.parse(raw) : {};
    } catch {
      sessions = {};
    }
  }

  function saveSessions() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    } catch (e) {
      console.warn('Gagal menyimpan sesi:', e);
    }
  }

  function createSession() {
    const id = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    sessions[id] = { id, title: 'Percakapan baru', messages: [], updatedAt: Date.now() };
    return id;
  }

  function deleteSession(id) {
    delete sessions[id];
    saveSessions();
    if (currentSessionId === id) {
      const remaining = Object.values(sessions).sort((a, b) => b.updatedAt - a.updatedAt);
      if (remaining.length) switchSession(remaining[0].id);
      else startNewChat();
    } else {
      renderSessionList();
    }
  }

  function timeGroupLabel(ts) {
    const now = new Date();
    const d = new Date(ts);
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const startOfYesterday = startOfToday - 86400000;
    const startOf7d = startOfToday - 7 * 86400000;
    const startOf30d = startOfToday - 30 * 86400000;

    if (ts >= startOfToday) return 'Hari ini';
    if (ts >= startOfYesterday) return 'Kemarin';
    if (ts >= startOf7d) return '7 hari terakhir';
    if (ts >= startOf30d) return '30 hari terakhir';
    return 'Lebih lama';
  }

  function renderSessionList(filterText = '') {
    const all = Object.values(sessions).sort((a, b) => b.updatedAt - a.updatedAt);
    const filtered = filterText
      ? all.filter(s => s.title.toLowerCase().includes(filterText.toLowerCase()))
      : all;

    sessionList.innerHTML = '';

    if (!filtered.length) {
      const empty = document.createElement('div');
      empty.className = 'session-empty';
      empty.textContent = filterText ? 'Tidak ada percakapan yang cocok.' : 'Belum ada percakapan. Mulai chat baru!';
      sessionList.appendChild(empty);
      return;
    }

    let lastGroup = null;
    filtered.forEach(s => {
      const group = timeGroupLabel(s.updatedAt);
      if (group !== lastGroup) {
        const label = document.createElement('div');
        label.className = 'session-group-label';
        label.textContent = group;
        sessionList.appendChild(label);
        lastGroup = group;
      }

      const item = document.createElement('div');
      item.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      item.dataset.id = s.id;

      const titleSpan = document.createElement('span');
      titleSpan.className = 'session-title';
      titleSpan.textContent = s.title;

      const delBtn = document.createElement('button');
      delBtn.className = 'session-delete';
      delBtn.title = 'Hapus percakapan';
      delBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>`;
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if (confirm(`Hapus "${s.title}"?`)) deleteSession(s.id);
      };

      item.appendChild(titleSpan);
      item.appendChild(delBtn);
      item.onclick = () => switchSession(s.id);

      sessionList.appendChild(item);
    });
  }

  searchInput.addEventListener('input', () => renderSessionList(searchInput.value.trim()));

  function switchSession(id) {
    if (!sessions[id]) return;
    stopSpeaking();
    currentSessionId = id;
    const sess = sessions[id];
    history = sess.messages.map(m => ({ role: m.role, content: m.content }));

    messages.innerHTML = '';
    messages.appendChild(emptyState);

    if (!sess.messages.length) {
      emptyState.style.display = 'flex';
    } else {
      emptyState.style.display = 'none';
      sess.messages.forEach(m => {
        const bubble = addMessage(m.role === 'user' ? 'user' : 'ai', m.displayHtml || '', m.images || []);
        if (m.role === 'assistant') {
          attachCopyButtons(bubble);
          addSpeakButton(bubble, m.content);
        }
      });
    }

    pendingImages = [];
    renderPreviews();
    renderSessionList(searchInput.value.trim());
    closeMobileSidebar();
  }

  function startNewChat() {
    const id = createSession();
    saveSessions();
    switchSession(id);
  }

  newChatBtn.addEventListener('click', startNewChat);

  function isMobile() { return window.innerWidth <= 860; }

  sidebarToggle.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    if (isMobile()) sidebarOverlay.classList.toggle('show', !sidebar.classList.contains('collapsed'));
  });

  sidebarOverlay.addEventListener('click', () => {
    sidebar.classList.add('collapsed');
    sidebarOverlay.classList.remove('show');
  });

  function closeMobileSidebar() {
    if (isMobile()) {
      sidebar.classList.add('collapsed');
      sidebarOverlay.classList.remove('show');
    }
  }

  if (isMobile()) sidebar.classList.add('collapsed');

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    for (const file of files) {
      if (pendingImages.length >= MAX_IMAGES) { alert(`Maksimal ${MAX_IMAGES} gambar per pesan.`); break; }
      if (!file.type.startsWith('image/')) continue;
      if (file.size > 10 * 1024 * 1024) { alert(`${file.name} terlalu besar (maks 10MB).`); continue; }
      const dataUrl = await fileToDataUrl(file);
      const base64 = dataUrl.split(',')[1];
      pendingImages.push({ dataUrl, base64, mimeType: file.type, name: file.name });
    }
    fileInput.value = '';
    renderPreviews();
  });

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderPreviews() {
    previewStrip.innerHTML = '';
    pendingImages.forEach((img, idx) => {
      const thumb = document.createElement('div');
      thumb.className = 'preview-thumb';
      thumb.innerHTML = `<img src="${img.dataUrl}" alt="${img.name}"/><button class="remove-thumb" data-idx="${idx}">✕</button>`;
      previewStrip.appendChild(thumb);
    });
    previewStrip.querySelectorAll('.remove-thumb').forEach(btn => {
      btn.onclick = () => { pendingImages.splice(parseInt(btn.dataset.idx), 1); renderPreviews(); };
    });
  }

  const inputBox = document.querySelector('.input-box');
  inputBox.addEventListener('dragover', e => { e.preventDefault(); inputBox.style.borderColor = 'var(--accent)'; });
  inputBox.addEventListener('dragleave', () => { inputBox.style.borderColor = ''; });
  inputBox.addEventListener('drop', async e => {
    e.preventDefault();
    inputBox.style.borderColor = '';
    const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
    for (const file of files) {
      if (pendingImages.length >= MAX_IMAGES) break;
      const dataUrl = await fileToDataUrl(file);
      const base64 = dataUrl.split(',')[1];
      pendingImages.push({ dataUrl, base64, mimeType: file.type, name: file.name });
    }
    renderPreviews();
  });

  input.addEventListener('paste', async e => {
    const items = Array.from(e.clipboardData?.items || []);
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (!file || pendingImages.length >= MAX_IMAGES) continue;
        const dataUrl = await fileToDataUrl(file);
        const base64 = dataUrl.split(',')[1];
        pendingImages.push({ dataUrl, base64, mimeType: file.type, name: 'pasted-image.png' });
      }
    }
    if (items.some(i => i.type.startsWith('image/'))) renderPreviews();
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  sendBtn.addEventListener('click', sendMessage);

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!currentSessionId) return;
    if (!confirm('Hapus semua pesan di percakapan ini?')) return;
    sessions[currentSessionId].messages = [];
    sessions[currentSessionId].title = 'Percakapan baru';
    saveSessions();
    switchSession(currentSessionId);
  });

  function sendChip(el) { input.value = el.textContent; sendMessage(); }

  function scrollBottom() { chatWrap.scrollTo({ top: chatWrap.scrollHeight, behavior: 'smooth' }); }

  function addMessage(role, html, images = []) {
    if (emptyState) emptyState.style.display = 'none';

    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const avatarDiv = document.createElement('div');
    avatarDiv.className = 'avatar';
    if (role === 'user') {
      avatarDiv.textContent = 'K';
    } else {
      avatarDiv.innerHTML = '<img src="assets/logo-icon.png" alt="AI"/>';
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (images.length) {
      const imgWrap = document.createElement('div');
      imgWrap.className = 'bubble-images';
      images.forEach(src => {
        const im = document.createElement('img');
        im.src = src;
        im.onclick = () => window.open(src, '_blank');
        imgWrap.appendChild(im);
      });
      bubble.appendChild(imgWrap);
    }

    const textPart = document.createElement('div');
    if (html) textPart.innerHTML = html;
    bubble.appendChild(textPart);

    div.appendChild(avatarDiv);
    div.appendChild(bubble);
    messages.appendChild(div);
    scrollBottom();
    return textPart;
  }

  function addTyping() {
    if (emptyState) emptyState.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'typing-indicator';

    const ava = document.createElement('div');
    ava.className = 'avatar';
    ava.innerHTML = '<img src="assets/logo-icon.png" alt="AI"/>';

    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    div.appendChild(ava);
    div.appendChild(bub);
    messages.appendChild(div);
    scrollBottom();
    return bub;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function renderMarkdown(text) { return marked.parse(text); }

  function attachCopyButtons(bubble) {
    bubble.querySelectorAll('pre').forEach(pre => {
      if (pre.querySelector('.copy-btn')) return;
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Salin';
      btn.onclick = () => {
        const code = pre.querySelector('code');
        navigator.clipboard.writeText(code ? code.textContent : pre.textContent);
        btn.textContent = 'Tersalin!';
        setTimeout(() => btn.textContent = 'Salin', 1800);
      };
      pre.style.position = 'relative';
      pre.appendChild(btn);
    });
    bubble.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function deriveTitle(text) {
    const clean = text.trim().replace(/\s+/g, ' ');
    if (!clean) return 'Gambar terlampir';
    return clean.length > 42 ? clean.slice(0, 42) + '…' : clean;
  }

  async function sendMessage() {
    const text = input.value.trim();
    const hasImages = pendingImages.length > 0;
    if (!text && !hasImages) return;
    if (isStreaming) return;
    if (!currentSessionId) startNewChat();

    isStreaming = true;
    sendBtn.disabled = true;

    const imagesForThisMsg = [...pendingImages];
    const imageDataUrls = imagesForThisMsg.map(i => i.dataUrl);

    input.value = '';
    input.style.height = 'auto';
    pendingImages = [];
    renderPreviews();

    let apiContent;
    if (hasImages) {
      apiContent = [
        { type: 'text', text: text || 'Tolong jelaskan gambar ini.' },
        ...imagesForThisMsg.map(img => ({
          type: 'image_url',
          image_url: { url: `data:${img.mimeType};base64,${img.base64}` }
        }))
      ];
    } else {
      apiContent = text;
    }

    const userDisplayHtml = text ? `<p>${escapeHtml(text).replace(/\n/g, '<br>')}</p>` : '';

    history.push({ role: 'user', content: apiContent });
    addMessage('user', userDisplayHtml, imageDataUrls);

    const sess = sessions[currentSessionId];
    sess.messages.push({ role: 'user', content: apiContent, displayHtml: userDisplayHtml, images: imageDataUrls });
    if (sess.messages.length === 1) sess.title = deriveTitle(text);
    sess.updatedAt = Date.now();
    saveSessions();
    renderSessionList(searchInput.value.trim());

    const aiBubble = addTyping();
    let fullText = '';
    const modelToUse = hasImages ? VISION_MODEL : modelSel.value;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, model: modelToUse })
      });

      if (!res.ok) {
        const err = await res.json();
        removeTyping();
        addMessage('ai', `<p style="color:var(--error)">❌ ${err.error || 'Terjadi kesalahan.'}</p>`);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      removeTyping();
      const finalBubble = addMessage('ai', '');

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') break;
          try {
            const parsed = JSON.parse(data);
            fullText += parsed.content || '';
            finalBubble.innerHTML = renderMarkdown(fullText);
            scrollBottom();
          } catch {}
        }
      }

      attachCopyButtons(finalBubble);
      addSpeakButton(finalBubble, fullText);
      history.push({ role: 'assistant', content: fullText });

      sess.messages.push({ role: 'assistant', content: fullText, displayHtml: renderMarkdown(fullText), images: [] });
      sess.updatedAt = Date.now();
      saveSessions();
      renderSessionList(searchInput.value.trim());

      if (ttsEnabled) {
        const speakBtn = finalBubble.parentElement.querySelector('.speak-btn');
        speakText(fullText, speakBtn);
      }

    } catch (err) {
      removeTyping();
      addMessage('ai', `<p style="color:var(--error)">❌ Koneksi gagal. Pastikan server berjalan.</p>`);
    } finally {
      isStreaming = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ═══════════════════ TEXT-TO-SPEECH (AI bersuara) ═══════════════════
  function pickIndonesianVoice() {
    const voices = speechSynthesis.getVoices();
    indonesianVoice =
      voices.find(v => v.lang === 'id-ID') ||
      voices.find(v => v.lang.startsWith('id')) ||
      null;
  }

  if ('speechSynthesis' in window) {
    pickIndonesianVoice();
    speechSynthesis.onvoiceschanged = pickIndonesianVoice;
  }

  function updateTtsToggleUI() {
    ttsToggle.classList.toggle('active', ttsEnabled);
    ttsToggle.title = ttsEnabled ? 'Matikan suara AI' : 'Aktifkan suara AI';
  }
  updateTtsToggleUI();

  ttsToggle.addEventListener('click', () => {
    ttsEnabled = !ttsEnabled;
    localStorage.setItem(TTS_KEY, ttsEnabled);
    updateTtsToggleUI();
    if (!ttsEnabled) stopSpeaking();
  });

  function stripMarkdownForSpeech(text) {
    return text
      .replace(/```[\s\S]*?```/g, ' kode terlampir. ')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/!\[.*?\]\(.*?\)/g, '')
      .replace(/\[([^\]]+)\]\(.*?\)/g, '$1')
      .replace(/[#*_>~-]/g, '')
      .replace(/\n+/g, '. ')
      .trim();
  }

  function speakText(text, btnEl) {
    if (!('speechSynthesis' in window)) {
      alert('Browser kamu tidak mendukung text-to-speech.');
      return;
    }
    stopSpeaking();

    const clean = stripMarkdownForSpeech(text);
    if (!clean) return;

    const utter = new SpeechSynthesisUtterance(clean);
    utter.lang = 'id-ID';
    if (indonesianVoice) utter.voice = indonesianVoice;
    utter.rate = 1.0;
    utter.pitch = 1.0;

    utter.onstart = () => { if (btnEl) btnEl.classList.add('speaking'); };
    utter.onend = () => { if (btnEl) btnEl.classList.remove('speaking'); currentUtterance = null; };
    utter.onerror = () => { if (btnEl) btnEl.classList.remove('speaking'); currentUtterance = null; };

    currentUtterance = utter;
    speechSynthesis.speak(utter);
  }

  function stopSpeaking() {
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    document.querySelectorAll('.speak-btn.speaking').forEach(b => b.classList.remove('speaking'));
    currentUtterance = null;
  }

  function addSpeakButton(bubbleTextEl, fullText) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const btn = document.createElement('button');
    btn.className = 'speak-btn';
    btn.title = 'Dengarkan jawaban ini';
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>`;
    btn.onclick = () => {
      if (btn.classList.contains('speaking')) {
        stopSpeaking();
      } else {
        speakText(fullText, btn);
      }
    };

    actions.appendChild(btn);
    bubbleTextEl.parentElement.appendChild(actions);
  }

  // ═══════════════════ SPEECH RECOGNITION (pengguna bicara) ═══════════════════
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'id-ID';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    let baseText = '';

    recognition.onstart = () => {
      isListening = true;
      baseText = input.value ? input.value + ' ' : '';
      micBtn.classList.add('listening');
    };

    recognition.onresult = (e) => {
      let interim = '';
      let final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const transcript = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += transcript;
        else interim += transcript;
      }
      input.value = baseText + final + interim;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    };

    recognition.onerror = (e) => {
      isListening = false;
      micBtn.classList.remove('listening');
      if (e.error === 'not-allowed' || e.error === 'permission-denied') {
        alert('Izin mikrofon ditolak. Aktifkan izin mikrofon di browser untuk pakai fitur ini.');
      } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
        console.warn('Speech recognition error:', e.error);
      }
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
    };

    micBtn.addEventListener('click', () => {
      if (isListening) {
        recognition.stop();
        return;
      }
      stopSpeaking();
      try {
        recognition.start();
      } catch (err) {
        console.warn('Gagal memulai speech recognition:', err);
      }
    });
  } else {
    micBtn.style.display = 'none';
  }

  (function init() {
    loadSessions();
    // Bersihkan sesi kosong (belum ada pesan) dari sesi sebelumnya yang tidak dipakai
    let changed = false;
    Object.keys(sessions).forEach(id => {
      if (!sessions[id].messages || sessions[id].messages.length === 0) {
        delete sessions[id];
        changed = true;
      }
    });
    if (changed) saveSessions();
    startNewChat();
  })();
</script>
</body>
</html>
